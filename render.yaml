# Render 웹 서비스 (Node 서버 + SQLite 디스크).
# 무료 플랜은 잠들고 디스크가 없어 계정·저장이 사라지므로, 다인 서버는 디스크가 붙는 유료 플랜이 필요하다.
services:
  - type: web
    name: pyoryu-yeohaeng
    runtime: node
    plan: starter
    buildCommand: echo "의존성 없음"
    startCommand: node server/server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_KEY      # 대시보드에서 직접 입력 (초대 코드 발급용 비밀번호)
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1

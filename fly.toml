# Fly.io 로 가장 싸게 돌리는 설정: 아무도 접속하지 않으면 머신이 꺼지고, 접속하면 켜진다.
# 먼저:  fly launch --no-deploy  →  fly volumes create data --size 1  →  fly secrets set ADMIN_KEY=원하는비밀번호  →  fly deploy
app = "pyoryu-yeohaeng"      # 이미 쓰는 이름이면 바꾸세요
primary_region = "nrt"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

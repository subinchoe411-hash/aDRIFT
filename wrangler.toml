# Cloudflare Workers + D1 (무료 플랜으로 돌릴 수 있는 설정)
name = "pyoryu-yeohaeng"
main = "worker/index.js"
compatibility_date = "2025-09-01"

# 화면 파일(public/)은 정적 자산으로 내보낸다. /api/* 만 Worker 코드가 처리한다.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# 데이터베이스. 아래 database_id(0으로 채운 값)를 Cloudflare 대시보드에서 D1 을 만든 뒤 나오는
# "Database ID" 로 꼭 바꿔야 배포된다 (README 참고).
[[d1_databases]]
binding = "DB"
database_name = "adrift"
database_id = "00000000-0000-0000-0000-000000000000"

# 만료된 거래 환불, 오래된 데이터 정리
[triggers]
crons = ["*/10 * * * *"]

# ADMIN_KEY 는 여기에 적지 않는다. 대시보드(Settings → Variables and secrets)에 'Secret' 으로 넣는다.
